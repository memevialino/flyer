<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Route Hunter</title><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./app.css"><link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet"></head>
<body><header class="topbar"><div><div class="brand">✈ Route Hunter</div><div class="subtitle">China Fleet Hunt</div></div><div class="header-actions"><button id="reset-button" class="small-button">Reiniciar</button><button id="share-button" class="small-button">Compartir</button><div class="lives" id="lives">❤️❤️❤️</div></div></header>
<main class="layout"><section class="panel journey-panel"><div class="section-label">POSICIÓN ACTUAL</div><h1 id="airport-name">Cargando...</h1><div class="airport-code" id="airport-code">---</div><div class="stats"><div><strong id="correct-count">0</strong><span>Aciertos</span></div><div><strong id="wrong-count">0</strong><span>Fallos</span></div><div><strong id="accuracy">0%</strong><span>Precisión</span></div></div><div class="section-label">MAPA</div><div id="map"></div><div class="journey"><div class="section-label">VIAJE</div><div id="journey-list"></div></div></section>
<section class="panel game-panel"><div class="round-header"><span id="round-number">MISIÓN</span><span class="badge">SOLO 1 CORRECTA</span></div><h2>¿Qué combinación corresponde a un vuelo real?</h2><p class="hint">Aerolínea + destino + avión deben ser correctos.</p><div id="options" class="options"></div><div id="feedback" class="feedback"></div></section>
<section class="panel hangar-panel"><div class="section-label">HANGAR</div><div id="hangar">Todavía vacío.</div></section></main><footer>Route Hunter · GitHub Pages + PWA</footer>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script><script type="module" src="./src/app.js"></script></body></html>
