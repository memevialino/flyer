name: Install Route Hunter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o flyer-route-hunter-v0.1.zip -d .
          rm flyer-route-hunter-v0.1.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Install Route Hunter v0.1"
          git push
